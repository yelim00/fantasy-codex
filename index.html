
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>섀도우 코어</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <header class="page-header">
    <p class="eyebrow">✦ ARCHIVES OF ETERNIA ✦</p>
    <h1>섀도우 코어</h1>
    <p class="subtitle">YOUR STORY · YOUR POWER</p>
  </header>

  <main class="layout">
    <section class="editor">
      <h2>✧ 상세 능력</h2>

      <label>캐릭터 이름
        <input id="characterName" placeholder="캐릭터 이름">
      </label>

      <label>칭호
        <input id="title" placeholder="예: 심연의 계승자">
      </label>

      <label>캐릭터 이미지 선택
        <input id="characterImage" type="file" accept="image/*">
      </label>

      <h3>고유 능력</h3>
      <label>능력 1
        <input id="ability1" placeholder="능력 이름">
        <textarea id="desc1" placeholder="능력 설명"></textarea>
      </label>
      <label>능력 2
        <input id="ability2" placeholder="능력 이름">
        <textarea id="desc2" placeholder="능력 설명"></textarea>
      </label>
      <label>능력 3
        <input id="ability3" placeholder="능력 이름">
        <textarea id="desc3" placeholder="능력 설명"></textarea>
      </label>
      <label>능력 4
        <input id="ability4" placeholder="능력 이름">
        <textarea id="desc4" placeholder="능력 설명"></textarea>
      </label>

      <h3>궁극기</h3>
      <label>궁극기 이름
        <input id="ultimate" placeholder="궁극기 이름">
      </label>
      <label>궁극기 설명
        <textarea id="ultimateDesc" placeholder="궁극기 설명"></textarea>
      </label>

      <h3>펫 소개</h3>
      <label>펫 이름
        <input id="petName" placeholder="펫 이름">
      </label>
      <label>펫 설명
        <textarea id="petDesc" placeholder="외형, 성격, 능력"></textarea>
      </label>

      <button id="saveImageBottom" type="button">✧ 이미지 저장</button>
    </section>

    <section class="preview">
      <article id="card" class="card">
        <div class="artwork">
          <img id="outImage" alt="캐릭터 일러스트" style="display:none;">

          <div id="imagePlaceholder">
            <span>✧</span>
            <p>CHARACTER ILLUSTRATION</p>
            <small>이미지를 선택해 주세요</small>
            <label class="card-image-picker">
              이미지 선택
              <input id="cardImageInput" type="file" accept="image/*">
            </label>
          </div>

          <div class="artwork-caption">ARCHIVES OF ETERNIA</div>
        </div>

        <div class="record">
          <div id="recordImageArea"></div>
          <p class="card-eyebrow">CHARACTER RECORD</p>
          <h2 id="outName">이름 없는 기록자</h2>
          <p id="outTitle" class="rank">미등록 칭호</p>

          <div class="rule"></div>
          <h3>✦ 고유 능력</h3>
          <div id="outAbilities" class="ability-grid"></div>

          <div class="rule"></div>
          <h3>✧ 궁극기</h3>
          <h4 id="outUltimate">궁극기 이름</h4>
          <p id="outUltimateDesc">아직 기록된 내용이 없습니다.</p>

          <div class="rule"></div>
          <h3>♢ 계약한 펫</h3>
          <h4 id="outPet">펫 이름</h4>
          <p id="outPetDesc">아직 기록된 내용이 없습니다.</p>

          <p class="record-footer">✦ YOUR STORY · YOUR POWER ✦</p>
          <button id="saveImage" type="button">✧ 이미지 저장</button>
        </div>
      </article>
    </section>
  </main>
</div>

<script src="./script.js"></script>
</body>
</html>
